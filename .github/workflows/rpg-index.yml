name: Refresh RPG content index

# The website is published from the root of the gh-page branch and reads the
# datapack JSONs directly from src/generated/resources. This workflow keeps that
# copy current and regenerates the file index.
#
# Only this YAML needs to exist on the default branch: the job checks out gh-page,
# which is where the site and the generator script live.

on:
  push:
    branches: [main]
    paths:
      - "src/generated/resources/data/gensokyolegacy/**"
      - "src/generated/resources/data/minecraft/tags/**"
      - "src/generated/resources/assets/gensokyolegacy/lang/**"
      - "src/main/resources/assets/gensokyolegacy/lang/**"
      - "src/main/resources/assets/gensokyolegacy/patchouli_books/**"
      - "assets/lang/vanilla/**"
      - "scripts/build_manifest.py"
      - "scripts/build_vanilla_lang.py"
      - "scripts/check_site.py"
      - ".github/workflows/rpg-index.yml"
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to mirror the RPG datapack from"
        required: false
        default: "main"

permissions:
  contents: write

# One refresh at a time, so two rapid pushes cannot race on the same branch.
concurrency:
  group: rpg-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    env:
      # Change this in the repository settings, or pass it via workflow_dispatch,
      # if the site should track a branch other than main.
      SOURCE_BRANCH: ${{ inputs.source_branch || vars.RPG_SOURCE_BRANCH || 'main' }}
    steps:
      # Check out the Pages branch: that is where the site, the generator and the
      # published copy of the datapack live. Checking out main here and pushing
      # HEAD to gh-page would delete the site, since main does not have it.
      - uses: actions/checkout@v4
        with:
          ref: gh-page
          fetch-depth: 0

      - name: Validate the site modules and translations
        run: |
          python3 -m pip install --quiet tree_sitter tree_sitter_javascript
          python3 scripts/check_site.py

      # A new vanilla item in the datapack needs a new line in assets/lang/vanilla.
      # That file is generated locally from the game data, so CI only verifies it.
      - name: Check the vanilla translation table
        run: python3 scripts/build_vanilla_lang.py --check

      - name: Mirror the RPG datapack from ${{ env.SOURCE_BRANCH }}
        run: |
          git fetch --quiet origin "$SOURCE_BRANCH"

          for path in \
            src/generated/resources/data/gensokyolegacy \
            src/generated/resources/data/minecraft/tags \
            src/generated/resources/assets/gensokyolegacy/lang \
            src/main/resources/assets/gensokyolegacy/lang \
            src/main/resources/assets/gensokyolegacy/patchouli_books
          do
            # Drop what is here first, so quests or tables that were deleted on the
            # source branch disappear here too; a plain checkout would not remove
            # them and the index would keep listing files that no longer exist.
            rm -rf "$path"
            git checkout "origin/$SOURCE_BRANCH" -- "$path"
          done

      - name: Regenerate rpg-manifest.json
        run: python3 scripts/build_manifest.py

      - name: Publish to gh-page
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "gh-page already matches $SOURCE_BRANCH"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync rpg content from $SOURCE_BRANCH"
          git push origin HEAD:gh-page
