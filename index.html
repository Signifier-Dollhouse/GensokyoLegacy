<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The mod name is the game&rsquo;s own translation of `gensokyolegacy.title`, so the
         heading follows the language toggle. The title is assembled in app.js from the
         same key; this is what a visitor sees before the scripts run. -->
    <title>Gensokyo Legacy &middot; Quests, Dialogs, Trades &amp; Items</title>
    <meta
      name="description"
      data-i18n-attr="content:meta.description"
      content="Browser for the Gensokyo Legacy RPG datapack: every quest, dialog and trade offer with its conditions and requirements, plus an item guide and where each item comes from, read straight from the generated JSON."
    />
    <link rel="stylesheet" href="assets/site.css" />
    <!-- The logo and the favicon are the mod's own Mini Hakkero texture. assets/img
         holds a copy so the page does not depend on a path outside itself, and
         scripts/check_site.py fails if that copy ever falls behind the texture. -->
    <link rel="icon" type="image/png" href="assets/img/hakkero.png" />
  </head>
  <body>
    <a class="skip" href="#content" data-i18n="a11y.skip">Skip to content</a>

    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="assets/img/hakkero.png" width="32" height="32" alt="" />
        <div>
          <h1 data-i18n-lang="gensokyolegacy.title">Gensokyo Legacy</h1>
          <p class="brand-sub" data-i18n="brand.sub">Quests, dialogs, trades &amp; items &mdash; read from the datapack</p>
        </div>
      </div>

      <div class="topbar-controls">
        <div class="field">
          <label class="sr-only" for="search" data-i18n="a11y.search">Search</label>
          <input
            id="search"
            type="search"
            placeholder="Search quests, dialogs, items&hellip;"
            data-i18n-attr="placeholder:search.placeholder"
            autocomplete="off"
          />
        </div>
        <div class="segmented" role="group" aria-label="Language" data-i18n-attr="aria-label:a11y.language">
          <button type="button" data-lang="en_us" aria-pressed="true">EN</button>
          <button type="button" data-lang="zh_cn" aria-pressed="false">中文</button>
        </div>
        <button
          id="theme"
          type="button"
          class="icon-button"
          aria-label="Toggle colour scheme"
          data-i18n-attr="aria-label:a11y.theme"
        >
          <span aria-hidden="true">◐</span>
        </button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" aria-label="Browse" data-i18n-attr="aria-label:a11y.browse">
        <details class="nav-group" id="nav-characters" open>
          <summary class="sidebar-title" data-i18n="nav.characters">Characters</summary>
          <ul id="characters" class="nav-list"></ul>
        </details>
        <details class="nav-group" id="nav-items" open>
          <summary class="sidebar-title" data-i18n="nav.items">Items</summary>
          <ul id="items" class="nav-list"></ul>
        </details>
        <details class="nav-group" id="nav-patchouli" open>
          <summary class="sidebar-title" data-i18n="nav.patchouli">Patchouli</summary>
          <ul id="guide" class="nav-list"></ul>
        </details>
        <div id="source" class="source-note"></div>
      </nav>

      <main id="content" class="content">
        <div id="status" class="status" role="status"></div>

        <div class="progress-track" id="loadbar">
          <div class="progress-fill" id="progress"></div>
        </div>

        <div class="tabs" role="tablist" aria-label="Content type" data-i18n-attr="aria-label:a11y.contentType">
          <button type="button" role="tab" data-tab="quest" aria-selected="true">
            <span data-i18n="tab.quest">Quests</span><span class="count" data-count="quest"></span>
          </button>
          <button type="button" role="tab" data-tab="daily" aria-selected="false">
            <span data-i18n="tab.daily">Dailies</span><span class="count" data-count="daily"></span>
          </button>
          <button type="button" role="tab" data-tab="trade" aria-selected="false">
            <span data-i18n="tab.trade">Trades</span><span class="count" data-count="trade"></span>
          </button>
          <button type="button" role="tab" data-tab="starters" aria-selected="false">
            <span data-i18n="tab.starters">Starters</span><span class="count" data-count="starters"></span>
          </button>
          <button type="button" role="tab" data-tab="dialog" aria-selected="false">
            <span data-i18n="tab.dialog">Dialogs</span><span class="count" data-count="dialog"></span>
          </button>
        </div>

        <div id="panel" class="panel" role="tabpanel"></div>
      </main>
    </div>

    <dialog id="viewer" class="viewer" aria-label="Detail" data-i18n-attr="aria-label:a11y.detail"></dialog>

    <noscript>
      <p class="noscript">
        This page reads the datapack JSON with JavaScript. Without it, browse the files directly under
        <a href="src/generated/resources/data/gensokyolegacy/gensokyolegacy/">src/generated/resources/data/gensokyolegacy/</a>
        for the quests, dialogs and trades,
        <a href="src/generated/resources/data/gensokyolegacy/recipe/">.../recipe/</a> for the recipes, and
        <a href="src/main/resources/assets/gensokyolegacy/patchouli_books/">src/main/resources/assets/gensokyolegacy/patchouli_books/</a>
        for the item guide.
      </p>
    </noscript>

    <script type="module" src="assets/app.js"></script>
  </body>
</html>
