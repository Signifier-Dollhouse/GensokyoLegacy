import net.darkhax.curseforgegradle.TaskPublishCurseForge

buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    }
    dependencies {
        classpath "org.spongepowered:mixingradle:0.7-SNAPSHOT"
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'net.darkhax.curseforgegradle' version '[1.1.24,1.2)'
    id "at.stnwtr.gradle-secrets-plugin" version "1.0.1"
    id "com.modrinth.minotaur" version "2.+"
}

apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = 'dev.xkmc'
archivesBaseName = mod_id
jarJar.enable()

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            workingDirectory project.file('run')
            arg "-mixin.config=${mod_id}.mixins.json"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            arg "-mixin.config=${mod_id}.mixins.json"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            arg "-mixin.config=${mod_id}.mixins.json"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            args '--mod', "${mod_id}", '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    // Registrate's datagen manifest, not a game resource.
    exclude '.cache/**'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    maven { // Registrate
        url "https://maven.tterrag.com/"
    }
    maven {
        // Location of the maven for vazkii's mods
        name 'blamejared'
        url 'https://maven.blamejared.com'
    }
    maven {
        url 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    maven {
        // TerraBlender
        name = 'Minecraft Forge'
        url = 'https://maven.minecraftforge.net/'
        content {
            includeGroup("com.github.glitchfiend")
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))

    // L2Library and the jars it ships are external dependencies, not jar-in-jar'd.
    implementation fg.deobf("dev.kxmc.l2library:l2library:${l2library_version}-slim")
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation fg.deobf("io.github.llamalad7:mixinextras-forge:${mixin_extras_version}")
    implementation fg.deobf("dev.xkmc.l2serial:l2serial:${l2serial_version}")
    implementation fg.deobf("dev.xkmc.l2tabs:l2tabs:${l2tabs_version}")
    implementation fg.deobf("dev.xkmc.l2screentracker:l2screentracker:${l2screentracker_version}")
    implementation fg.deobf("dev.xkmc.l2modularblock:l2modularblock:${l2modularblock_version}")
    implementation fg.deobf("dev.xkmc.l2itemselector:l2itemselector:${l2itemselector_version}")

    // Not carried by L2Library.
    implementation fg.deobf(jarJar("dev.xkmc.l2damagetracker:l2damagetracker:${l2damagetracker_version}")) {
        transitive = false
        jarJar.ranged(it, "[${l2damagetracker_version},)")
    }
    implementation fg.deobf(jarJar("dev.xkmc.fastprojectileapi:fast_projectile_api:${fast_projectile_api_version}")) {
        transitive = false
        jarJar.ranged(it, "[${fast_projectile_api_version},)")
    }
    implementation fg.deobf(jarJar("dev.xkmc.danmakuapi:danmaku_api:${danmaku_api_version}")) {
        transitive = false
        jarJar.ranged(it, "[${danmaku_api_version},)")
    }
    implementation fg.deobf(jarJar("dev.xkmc.l2harvester:l2harvester:${l2harvester_version}")) {
        transitive = false
        jarJar.ranged(it, "[${l2harvester_version},)")
    }
    implementation fg.deobf(jarJar("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")) {
        transitive = false
        jarJar.ranged(it, "[${geckolib_version},)")
    }
    implementation fg.deobf(jarJar("com.github.glitchfiend:TerraBlender-forge:${terrablender_version}")) {
        transitive = false
        jarJar.ranged(it, "[1.20.1-3,)")
    }

    implementation fg.deobf("curse.maven:farmers-delight-398521:8000996")
    implementation fg.deobf("curse.maven:display-delight-1144296:8242933")
    implementation fg.deobf("curse.maven:kaleidoscope-cookery-1309203:9019240")
    compileOnly fg.deobf("curse.maven:some-assembly-required-422951:7701961")

    implementation fg.deobf("youkaisfeasts:youkaisfeasts:${youkaisfeasts_version}")

    implementation fg.deobf("mezz.jei:jei-${jei_minecraft_version}:${jei_version}")
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    implementation fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")

    implementation fg.deobf("curse.maven:better-advancements-272515:6010300")
    implementation fg.deobf("curse.maven:touhou-little-maid-355044:6440955")
    // TLM bundles this as an obfuscation-safe jar-in-jar for runtime; javac still needs it to
    // resolve EntityMaidRenderer's BedrockModel type argument.
    compileOnly files("libs/simplebedrockmodel-1.20.1-release-1.1.0.jar")
    implementation fg.deobf("curse.maven:jade-324717:4654448")
    compileOnly fg.deobf("curse.maven:create-328085:6255513")

    testImplementation "com.mojang:datafixerupper:6.0.8"
    testImplementation "com.google.guava:guava:32.1.2-jre"
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "${mod_id}",
                "Specification-Vendor"    : "xkmc",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "xkmc",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}

reobf {
    jarJar {}
}

jar.finalizedBy('reobfJar')
tasks.jarJar.finalizedBy('reobfJarJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.jarJar.configure {
    archiveClassifier.set('')
}

jar {
    archiveClassifier.set('slim')
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version          : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version              : forge_version, loader_version_range: loader_version_range,
            terrablender_version_range : terrablender_version_range,
            mod_id                     : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors                : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    group = 'publishing'
    apiToken = secrets.get("curseforge_token")
    def mainFile = upload(curseforge_project, new File("./build/libs/${mod_id}-${mod_version}.jar"))
    mainFile.changelog = new File('./changelog.txt')
    mainFile.addEnvironment("Client", "Server")
    mainFile.addGameVersion("1.20.1")
    mainFile.addModLoader("Forge")
    mainFile.addRequirement("curios", "patchouli")
    mainFile.releaseType = "release"
    disableVersionDetection()
}

modrinth {
    token = secrets.get("modrinth_token")
    projectId = project.modrinth_project
    versionName = "Gensokyo Legacy ${project.mod_version}"
    versionNumber = project.mod_version
    versionType = "release"
    uploadFile = new File("./build/libs/${mod_id}-${mod_version}.jar")
    gameVersions = ["1.20.1"]
    loaders = ["forge"]
    changelog = new File('./changelog.txt').text.split("\n\n")[0]
    dependencies {
        required.project "curios"
        required.project "patchouli"
    }
}
